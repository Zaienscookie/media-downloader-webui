<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 · 媒体下载器</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #0B0F17; color: #E5E7EB; min-height: 100vh;
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .card {
    width: 100%; max-width: 360px; background: #131A26; border: 1px solid #1F2937;
    border-radius: 16px; padding: 32px 28px;
  }
  h1 { font-size: 22px; font-weight: 700; margin-bottom: 4px; text-align: center; }
  h1 span { background: linear-gradient(90deg,#fff,#3B82F6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .sub { color: #8B94A7; font-size: 13px; text-align: center; margin-bottom: 26px; }
  label { display: block; font-size: 12px; color: #8B94A7; margin-bottom: 6px; }
  input {
    width: 100%; background: #0B0F17; border: 1px solid #1F2937; border-radius: 8px;
    padding: 12px; color: #E5E7EB; font-size: 15px; outline: none; margin-bottom: 16px;
  }
  input:focus { border-color: #3B82F6; }
  button {
    width: 100%; background: #3B82F6; color: #fff; border: none; border-radius: 8px;
    padding: 12px; font-size: 15px; font-weight: 600; cursor: pointer; transition: .15s;
  }
  button:hover { background: #2563EB; }
  .err { color: #F87171; font-size: 13px; text-align: center; margin-bottom: 14px; min-height: 18px; }
</style>
</head>
<body>
  <form class="card" method="post" action="/login">
    <h1>媒体<span>下载器</span></h1>
    <div class="sub">请登录后使用</div>
    <div class="err">{{ error }}</div>
    <label>用户名</label>
    <input name="username" autocomplete="username" autofocus required>
    <label>密码</label>
    <input name="password" type="password" autocomplete="current-password" required>
    <button type="submit">登录</button>
  </form>
</body>
</html>
